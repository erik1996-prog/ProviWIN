; 09_CONFIG/php-produccion.ini - Ajustes de PHP para producción (100+ usuarios).
; Copiar a /etc/php/8.x/fpm/conf.d/99-sgs.ini (Linux con PHP-FPM) y reiniciar php-fpm.

; OPcache: PHP guarda el código ya interpretado en memoria. Es la mejora de rendimiento más grande.
opcache.enable=1
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; En producción el código solo cambia al desplegar: se revisa cada 60 s (o reiniciar php-fpm tras actualizar).
opcache.validate_timestamps=1
opcache.revalidate_freq=60

; Rutas de archivos en caché
realpath_cache_size=4096K
realpath_cache_ttl=600

; Límites razonables (evitan que una petición atascada consuma el servidor)
memory_limit=256M
max_execution_time=60
upload_max_filesize=16M
post_max_size=40M
max_file_uploads=20

; Seguridad
expose_php=Off
display_errors=Off
log_errors=On
session.cookie_httponly=1
session.cookie_secure=1
session.use_strict_mode=1
session.gc_maxlifetime=28800
